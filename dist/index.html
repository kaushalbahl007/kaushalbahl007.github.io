<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfd" />
    <meta name="description" content="Benzene Studio creates small, focused apps and games." />
    <title>Benzene Studio — Apps built with care</title>
    <script type="module" crossorigin src="/assets/index-BjFMgtmf.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-C-xai8vT.css">
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function(){
        try{
          var t = localStorage.getItem('bz-theme')
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', t)
          document.querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#000000' : '#fbfbfd')
        }catch(e){}
      })()
    </script>
    <div id="root"></div>
  </body>
</html>
